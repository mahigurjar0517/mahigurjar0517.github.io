<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi Gurjar Cars</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
        }
        header p {
            font-size: 18px;
            color: #ccc;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .car {
            background: white;
            margin: 15px auto;
            padding: 15px;
            border-radius: 10px;
            width: 80%;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .car img {
            width: 100%;
            border-radius: 10px;
        }
        .car h2 {
            margin: 10px 0;
        }
        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🚗 Mahi Gurjar Cars</h1>
    <p>Owned by Mahi Gurjar</p>
</header>

<div class="container">
    <h2>Available Cars for Sale</h2>

    <div class="car">
        <img src="https://via.placeholder.com/600x300" alt="Car 1">
        <h2>Luxury Sedan</h2>
        <p>Price: ₹10,00,000</p>
    </div>

    <div class="car">
        <img src="https://via.placeholder.com/600x300" alt="Car 2">
        <h2>Sports Car</h2>
        <p>Price: ₹20,00,000</p>
    </div>

    <div class="car">
        <img src="https://via.placeholder.com/600x300" alt="Car 3">
        <h2>SUV</h2>
        <p>Price: ₹15,00,000</p>
    </div>
</div>

<footer>
    <p>© 2026 Mahi Gurjar | All Rights Reserved</p>
</footer>

</body>
</html>
